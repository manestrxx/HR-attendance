<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow p-4 flex justify-between items-center">
        <span class="text-xl font-bold text-blue-600">🏢 HR Attendance System</span>
        <button onclick="toggleLang()" id="lang-btn" class="bg-gray-200 px-3 py-1 rounded-lg text-sm font-semibold">English 🌐</button>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 space-y-6">
            <div class="text-center">
                <h1 id="txt-heading" class="text-2xl font-bold text-gray-800">تسجيل الحضور والانصراف</h1>
                <p id="txt-subheading" class="text-sm text-gray-500">أدخل رقمك الوظيفي والرمز لتسجيل الحضور</p>
            </div>

            <div class="bg-blue-50 p-3 rounded-xl text-center">
                <div id="live-time" class="text-2xl font-bold text-blue-700">00:00:00</div>
            </div>

            <form id="attendance-form" class="space-y-4">
                <div>
                    <label id="lbl-empid" class="block text-sm font-semibold mb-1">الرقم الوظيفي</label>
                    <input type="text" id="employee_id" required placeholder="EMP001" class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label id="lbl-pin" class="block text-sm font-semibold mb-1">رمز الدخول (PIN)</label>
                    <input type="password" id="pin" required maxlength="6" placeholder="••••" class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-blue-500 text-center tracking-widest text-lg outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="submitAttendance('check-in')" id="btn-checkin" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow">تسجيل الحضور</button>
                    <button type="button" onclick="submitAttendance('check-out')" id="btn-checkout" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow">تسجيل الانصراف</button>
                </div>
            </form>

            <div id="message-box" class="hidden p-4 rounded-xl text-center text-sm font-medium"></div>
        </div>
    </main>

    <script>
        let currentLang = 'ar';
        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('html-root').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('txt-heading').innerText = currentLang === 'ar' ? 'تسجيل الحضور والانصراف' : 'Attendance System';
            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'English 🌐' : 'العربية 🌐';
            document.getElementById('btn-checkin').innerText = currentLang === 'ar' ? 'تسجيل الحضور' : 'Check In';
            document.getElementById('btn-checkout').innerText = currentLang === 'ar' ? 'تسجيل الانصراف' : 'Check Out';
        }

        setInterval(() => {
            document.getElementById('live-time').innerText = new Date().toLocaleTimeString();
        }, 1000);

        async function submitAttendance(actionType) {
            const employee_id = document.getElementById('employee_id').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const msgBox = document.getElementById('message-box');

            if (!employee_id || !pin) {
                msgBox.className = "p-4 rounded-xl text-center bg-amber-50 text-amber-700 border";
                msgBox.innerText = 'يرجى إدخال البيانات كاملة';
                msgBox.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee_id, pin, action: actionType })
                });
                const data = await res.json();
                msgBox.classList.remove('hidden');
                if (res.ok) {
                    msgBox.className = "p-4 rounded-xl text-center bg-emerald-50 text-emerald-700 border";
                    msgBox.innerText = `${data.message} (${data.employee_name})`;
                } else {
                    msgBox.className = "p-4 rounded-xl text-center bg-rose-50 text-rose-700 border";
                    msgBox.innerText = data.error;
                }
            } catch (e) {
                msgBox.classList.remove('hidden');
                msgBox.className = "p-4 rounded-xl text-center bg-rose-50 text-rose-700 border";
                msgBox.innerText = 'فشل الاتصال بالخادم';
            }
        }
    </script>
</body>
</html>
