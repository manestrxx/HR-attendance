# render.yaml — إعدادات النشر على Render (الخطة المجانية + قاعدة Turso للحفظ الدائم)
services:
  - type: web
    name: hr-attendance
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_TIMEZONE
        value: Asia/Muscat
      - key: TURSO_DATABASE_URL
        sync: false            # من لوحة Turso (يبدأ بـ libsql://)
      - key: TURSO_AUTH_TOKEN
        sync: false            # من لوحة Turso
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: HR Reminders <onboarding@resend.dev>
