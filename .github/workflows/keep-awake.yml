# يبقي الموقع صاحيًا على خطة Render المجانية (ينام بعد 15 دقيقة بدون زيارات).
# GitHub يشغّل المهام المجدولة كل 25-35 دقيقة تقريبًا مهما طلبنا أقل،
# لذلك كل تشغيل يزور الموقع عدة مرات بفاصل 4 دقائق ليغطي الفجوة بين التشغيلات.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ping every 4 minutes
        run: |
          for i in 1 2 3 4 5 6 7; do
            curl -fsS --max-time 60 -o /dev/null -w "ping $i: %{http_code} in %{time_total}s\n" \
              https://hr-attendance-abpr.onrender.com/healthz || echo "ping $i failed"
            [ "$i" -lt 7 ] && sleep 240
          done
