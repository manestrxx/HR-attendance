# يبقي الموقع صاحيًا على خطة Render المجانية (ينام بعد 15 دقيقة بدون زيارات).
# GitHub يشغّل المهام المجدولة على فترات غير منتظمة (بين 35 و75 دقيقة تقريبًا)،
# لذلك كل تشغيل يزور الموقع كل 4 دقائق لمدة 80 دقيقة، والتشغيل الجديد يحل محل القديم،
# فتبقى التغطية متواصلة بدون فجوات.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Ping every 4 minutes for 80 minutes
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 60 -o /dev/null -w "ping $i: %{http_code} in %{time_total}s\n" \
              https://hr-attendance-abpr.onrender.com/healthz || echo "ping $i failed"
            if [ "$i" -lt 20 ]; then sleep 240; fi
          done
          exit 0
