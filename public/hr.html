<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>لوحة الموارد البشرية | HR Dashboard</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen">

  <!-- ===== شاشة الدخول ===== -->
  <main id="login-view" class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4" hidden>
    <div class="mb-6 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5"><img src="/icon.svg" alt="" class="h-10 w-10"><span class="text-lg font-bold" data-i18n="hr_title">لوحة الموارد البشرية</span></a>
      <button data-lang-toggle class="icon-btn">EN</button>
    </div>
    <form id="login-form" class="card space-y-4 p-6">
      <label class="block"><span class="label" data-i18n="username">اسم المستخدم</span>
        <input name="username" class="field" autocomplete="username" required dir="ltr"></label>
      <label class="block"><span class="label" data-i18n="password">كلمة المرور</span>
        <input name="password" type="password" class="field" autocomplete="current-password" required dir="ltr"></label>
      <p id="login-error" class="text-sm" style="color:var(--red)" hidden></p>
      <button class="btn btn-primary w-full py-3.5" data-i18n="login">دخول</button>
    </form>
  </main>

  <!-- ===== لوحة التحكم ===== -->
  <div id="app-view" hidden>
    <header class="sticky top-0 z-20 border-b-2 bg-white/95 backdrop-blur" style="border-color:var(--line)">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
        <div class="flex min-w-0 items-center gap-2.5">
          <img src="/icon.svg" alt="" class="h-9 w-9">
          <div class="min-w-0">
            <div id="company-name" class="truncate font-bold leading-tight">HR</div>
            <div id="live-dot" class="flex items-center gap-1.5 text-xs muted"><span class="dot-live"></span><span data-i18n="live">مباشر</span></div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button data-lang-toggle class="icon-btn">EN</button>
          <button id="btn-password" class="icon-btn hidden md:grid" aria-label="password">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3m-3 3l2 2m-5 1l2 2"/></svg></button>
          <button id="btn-logout" class="btn btn-ghost btn-sm hidden md:inline-flex" data-i18n="logout">تسجيل الخروج</button>
        </div>
      </div>
      <nav class="mx-auto hidden max-w-6xl gap-1 overflow-x-auto px-4 md:flex" role="tablist">
        <button class="tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold" data-tab="live" data-i18n="tab_live"></button>
        <button class="tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold" data-tab="records" data-i18n="tab_records"></button>
        <button class="tab-btn tab-top flex items-center gap-1.5 border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold" data-tab="excuses"><span data-i18n="tab_excuses"></span><span class="count-pill pending-pill" hidden></span></button>
        <button class="tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold" data-tab="employees" data-i18n="tab_employees"></button>
        <button class="tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold whitespace-nowrap" data-tab="holidays" data-i18n="tab_holidays"></button>
        <button class="tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold whitespace-nowrap" data-tab="reminders" data-i18n="tab_reminders"></button>
        <button class="tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold whitespace-nowrap" data-tab="export" data-i18n="tab_export"></button>
        <button class="admin-only tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold whitespace-nowrap" data-tab="settings" data-i18n="tab_settings"></button>
        <button class="admin-only tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold whitespace-nowrap" data-tab="users" data-i18n="tab_users"></button>
        <button class="admin-only tab-btn tab-top border-b-2 border-transparent px-3 py-2.5 text-sm font-semibold whitespace-nowrap" data-tab="audit" data-i18n="tab_audit"></button>
      </nav>
    </header>

    <main class="mx-auto max-w-6xl px-4 pb-28 pt-5 md:pb-12">
      <p class="viewer-only card-soft mb-4 px-4 py-2.5 text-sm font-medium" style="color:var(--blue)" data-i18n="read_only"></p>

      <!-- ===== مباشر ===== -->
      <section id="tab-live" class="tab-panel space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <input id="live-date" type="date" class="field max-w-[11rem] tabular" dir="ltr">
          <div class="text-sm muted"><span data-i18n="work_hours"></span>: <b id="live-hours" class="tabular" dir="ltr" style="color:var(--blue)"></b></div>
        </div>
        <p id="day-off" class="card-soft px-4 py-3 text-sm font-medium" style="color:var(--blue)" data-i18n="day_off_note" hidden></p>
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
          <button data-filter="in" class="stat"><div class="n tabular" style="color:var(--green)" id="stat-in">0</div><div class="text-sm muted" data-i18n="stat_in"></div></button>
          <button data-filter="late" class="stat"><div class="n tabular" style="color:var(--amber)" id="stat-late">0</div><div class="text-sm muted" data-i18n="stat_late"></div></button>
          <button data-filter="out" class="stat"><div class="n tabular" style="color:var(--blue)" id="stat-out">0</div><div class="text-sm muted" data-i18n="stat_out"></div></button>
          <button data-filter="absent" class="stat"><div class="n tabular" style="color:var(--red)" id="stat-absent">0</div><div class="text-sm muted" data-i18n="stat_absent"></div></button>
          <button data-filter="excused" class="stat"><div class="n tabular" style="color:var(--violet)" id="stat-excused">0</div><div class="text-sm muted" data-i18n="stat_excused"></div></button>
          <button data-filter="all" class="stat"><div class="n tabular" id="stat-total">0</div><div class="text-sm muted" data-i18n="stat_total"></div></button>
        </div>
        <div class="grid gap-4 lg:grid-cols-3">
          <div class="card p-4 lg:col-span-2">
            <input id="live-search" class="field mb-2 py-2 text-sm" data-i18n-placeholder="search">
            <ul id="live-list" class="divide-y" style="--tw-divide-opacity:1;border-color:var(--blue-100)"></ul>
          </div>
          <div class="card p-4">
            <h2 class="mb-3 font-bold" data-i18n="recent"></h2>
            <ul id="recent-list" class="space-y-2.5"></ul>
          </div>
        </div>
      </section>

      <!-- ===== السجلات ===== -->
      <section id="tab-records" class="tab-panel space-y-4" hidden>
        <form id="records-form" class="card grid grid-cols-2 gap-3 p-4 md:grid-cols-6">
          <label><span class="label" data-i18n="from"></span><input name="from" type="date" class="field tabular" dir="ltr"></label>
          <label><span class="label" data-i18n="to"></span><input name="to" type="date" class="field tabular" dir="ltr"></label>
          <label class="col-span-2"><span class="label" data-i18n="search"></span><input name="q" class="field" data-i18n-placeholder="search"></label>
          <div class="col-span-2 flex items-end gap-2">
            <select name="view" class="field">
              <option value="movements" data-i18n="view_movements"></option>
              <option value="summary" data-i18n="view_summary"></option>
              <option value="period" data-i18n="view_period"></option>
            </select>
            <button class="btn btn-primary shrink-0" data-i18n="show"></button>
          </div>
        </form>
        <details class="w-only card p-4">
          <summary class="cursor-pointer font-bold" style="color:var(--blue)" data-i18n="add_record"></summary>
          <form id="manual-form" class="mt-4 grid grid-cols-2 gap-3 md:grid-cols-6">
            <input name="emp_no" class="field col-span-2 tabular md:col-span-1" data-i18n-placeholder="emp_no" required dir="ltr">
            <select name="type" class="field"><option value="in" data-i18n="in"></option><option value="out" data-i18n="out"></option></select>
            <input name="date" type="date" class="field tabular" required dir="ltr">
            <input name="time" type="time" class="field tabular" required dir="ltr">
            <input name="note" class="field col-span-2 md:col-span-1" data-i18n-placeholder="note">
            <button class="btn btn-primary col-span-2 md:col-span-1" data-i18n="save"></button>
          </form>
        </details>
        <div class="card p-4">
          <p id="records-count" class="mb-2 text-sm muted"></p>
          <div id="records-out" class="overflow-x-auto"></div>
        </div>
      </section>

      <!-- ===== الأعذار ===== -->
      <section id="tab-excuses" class="tab-panel space-y-4" hidden>
        <div class="flex flex-wrap items-center gap-2" id="excuse-chips">
          <button class="chip" data-status="pending" data-i18n="st_pending"></button>
          <button class="chip" data-status="approved" data-i18n="st_approved"></button>
          <button class="chip" data-status="rejected" data-i18n="st_rejected"></button>
          <button class="chip" data-status="" data-i18n="all"></button>
          <input id="excuse-search" class="field ms-auto max-w-xs py-2 text-sm" data-i18n-placeholder="search">
        </div>
        <details class="w-only card p-4">
          <summary class="cursor-pointer font-bold" style="color:var(--blue)" data-i18n="add_excuse"></summary>
          <form id="excuse-form" class="mt-4 grid grid-cols-2 gap-3">
            <label><span class="label" data-i18n="emp_no"></span><input name="emp_no" class="field tabular" required dir="ltr"></label>
            <label><span class="label" data-i18n="excuse_type"></span>
              <select name="type" class="field">
                <option value="medical" data-i18n="ex_medical"></option><option value="personal" data-i18n="ex_personal"></option>
                <option value="late" data-i18n="ex_late"></option><option value="early_leave" data-i18n="ex_early_leave"></option>
                <option value="absence" data-i18n="ex_absence"></option><option value="other" data-i18n="ex_other"></option>
              </select></label>
            <label><span class="label" data-i18n="date_from"></span><input name="date_from" type="date" class="field tabular" required dir="ltr"></label>
            <label><span class="label" data-i18n="date_to"></span><input name="date_to" type="date" class="field tabular" dir="ltr"></label>
            <label class="col-span-2"><span class="label" data-i18n="reason"></span><textarea name="reason" class="field" maxlength="1000"></textarea></label>
            <label class="col-span-2"><span class="label" data-i18n="attachment"></span><input name="file" type="file" accept="image/*,application/pdf" class="field py-2 text-sm"></label>
            <label><span class="label" data-i18n="save_as"></span>
              <select name="status" class="field"><option value="approved" data-i18n="st_approved"></option><option value="pending" data-i18n="st_pending"></option><option value="rejected" data-i18n="st_rejected"></option></select></label>
            <div class="flex items-end"><button class="btn btn-primary w-full" data-i18n="save"></button></div>
          </form>
        </details>
        <ul id="excuse-list" class="grid gap-3 md:grid-cols-2"></ul>
      </section>

      <!-- ===== الموظفون ===== -->
      <section id="tab-employees" class="tab-panel space-y-4" hidden>
        <div class="w-only grid gap-4 md:grid-cols-2">
          <details class="card p-4" open>
            <summary class="cursor-pointer font-bold" style="color:var(--blue)" data-i18n="add_employee"></summary>
            <form id="emp-form" class="mt-4 grid grid-cols-2 gap-3">
              <input name="emp_no" class="field tabular" data-i18n-placeholder="emp_no" required dir="ltr">
              <input name="pin" class="field tabular" data-i18n-placeholder="pin" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required dir="ltr">
              <input name="name" class="field col-span-2" data-i18n-placeholder="name" required>
              <input name="department" class="field" data-i18n-placeholder="department">
              <input name="job_title" class="field" data-i18n-placeholder="job_title">
              <label class="col-span-2"><span class="label" data-i18n="geo_mode"></span>
                <select name="geo_mode" class="field geo-mode">
                  <option value="any" data-i18n="geo_any"></option><option value="assigned" data-i18n="geo_assigned"></option><option value="exempt" data-i18n="geo_exempt"></option>
                </select></label>
              <div class="site-picker col-span-2 flex flex-wrap gap-2" hidden></div>
              <p class="col-span-2 text-xs muted" data-i18n="pin_hint"></p>
              <button class="btn btn-primary col-span-2" data-i18n="save"></button>
            </form>
          </details>
          <div class="card p-4">
            <h2 class="font-bold" data-i18n="import_title"></h2>
            <p class="mt-1 text-sm muted" data-i18n="import_hint"></p>
            <label class="card-soft mt-4 flex cursor-pointer items-center justify-center gap-2 border-2 border-dashed py-6 text-sm font-semibold" style="color:var(--blue);border-color:var(--line)">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
              <span data-i18n="choose_file"></span>
              <input id="import-file" type="file" accept=".xlsx,.csv,text/csv" class="hidden">
            </label>
            <p id="import-result" class="mt-3 whitespace-pre-line text-sm" hidden></p>
            <div class="mt-3 flex gap-2">
              <a href="/api/hr/template?format=xlsx" class="btn btn-ghost btn-sm" data-i18n="template_xlsx"></a>
              <a href="/api/hr/template?format=csv" class="btn btn-ghost btn-sm" data-i18n="template_csv"></a>
            </div>
          </div>
        </div>
        <div class="card p-4">
          <input id="emp-search" class="field mb-2 py-2 text-sm" data-i18n-placeholder="search">
          <ul id="emp-list"></ul>
        </div>
      </section>

      <!-- ===== التذكيرات ===== -->
      <section id="tab-reminders" class="tab-panel space-y-4" hidden>
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="max-w-xl">
            <h2 class="text-xl font-bold" data-i18n="reminders_title"></h2>
            <p class="mt-1 text-sm muted" data-i18n="reminders_hint"></p>
          </div>
          <button id="btn-add-reminder" class="w-only btn btn-primary">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="add_reminder"></span></button>
        </div>
        <div id="email-warning" class="card-soft flex flex-wrap items-center justify-between gap-3 px-4 py-3" style="background:#fff8ec;border-color:#f6dfb2" hidden>
          <p class="text-sm font-medium" style="color:#8a5300" data-i18n="email_missing"></p>
          <button class="btn btn-ghost btn-sm" data-goto="settings" data-i18n="go_settings"></button>
        </div>
        <ul id="reminder-list" class="grid gap-3 md:grid-cols-2"></ul>
        <details class="card p-4">
          <summary class="cursor-pointer font-bold" data-i18n="send_log"></summary>
          <ul id="reminder-log" class="mt-3 space-y-2 text-sm"></ul>
        </details>
      </section>

      <!-- ===== التصدير ===== -->
      <section id="tab-export" class="tab-panel" hidden>
        <form id="export-form" class="card mx-auto max-w-lg space-y-4 p-5">
          <div>
            <h2 class="text-xl font-bold" data-i18n="export_title"></h2>
            <p class="mt-1 text-sm muted" data-i18n="export_hint"></p>
          </div>
          <div class="flex flex-wrap gap-2" id="quick-ranges">
            <button type="button" data-range="today" class="chip" data-i18n="today"></button>
            <button type="button" data-range="week" class="chip" data-i18n="this_week"></button>
            <button type="button" data-range="month" class="chip" data-i18n="this_month"></button>
            <button type="button" data-range="last_month" class="chip" data-i18n="last_month"></button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <label><span class="label" data-i18n="from"></span><input name="from" type="date" class="field tabular" required dir="ltr"></label>
            <label><span class="label" data-i18n="to"></span><input name="to" type="date" class="field tabular" required dir="ltr"></label>
          </div>
          <button data-format="xlsx" class="btn btn-primary w-full py-3.5">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
            <span data-i18n="export_excel"></span></button>
          <div class="grid grid-cols-2 gap-2">
            <button data-format="csv_movements" class="btn btn-ghost btn-sm" data-i18n="export_csv"></button>
            <button data-format="csv_summary" class="btn btn-ghost btn-sm" data-i18n="export_csv_summary"></button>
            <button data-format="csv_period" class="btn btn-ghost btn-sm" data-i18n="export_csv_period"></button>
            <button data-format="csv_excuses" class="btn btn-ghost btn-sm" data-i18n="export_csv_excuses"></button>
          </div>
        </form>
      </section>

      <!-- ===== الإعدادات ===== -->
      <section id="tab-settings" class="tab-panel space-y-4" hidden>
        <div class="card mx-auto max-w-3xl p-5">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="max-w-xl">
              <h2 class="text-lg font-bold" data-i18n="sites_title"></h2>
              <p class="mt-1 text-sm muted" data-i18n="sites_hint"></p>
            </div>
            <button type="button" id="btn-add-site" class="btn btn-primary btn-sm">
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              <span data-i18n="add_site"></span></button>
          </div>
          <ul id="site-list" class="mt-4 grid gap-3 sm:grid-cols-2"></ul>
        </div>
        <form id="settings-form" class="mx-auto grid max-w-3xl gap-4 md:grid-cols-2">
          <div class="card space-y-4 p-5">
            <h2 class="font-bold" data-i18n="settings_company"></h2>
            <label class="block"><span class="label" data-i18n="company_name"></span><input name="company_name" class="field" maxlength="80"></label>
            <h2 class="pt-2 font-bold" data-i18n="settings_work"></h2>
            <div class="grid grid-cols-2 gap-3">
              <label><span class="label" data-i18n="work_start"></span><input name="work_start" type="time" class="field tabular" dir="ltr" required></label>
              <label><span class="label" data-i18n="work_end"></span><input name="work_end" type="time" class="field tabular" dir="ltr" required></label>
            </div>
            <label class="block"><span class="label" data-i18n="grace"></span><input name="grace_minutes" type="number" min="0" max="180" class="field tabular" dir="ltr"></label>
            <div>
              <span class="label" data-i18n="weekend"></span>
              <div id="weekend-days" class="flex flex-wrap gap-2"></div>
            </div>
            <button class="btn btn-primary w-full" data-i18n="save"></button>
          </div>
          <div class="card space-y-4 p-5">
            <div class="flex items-center justify-between gap-2">
              <h2 class="font-bold" data-i18n="settings_email"></h2>
              <span id="email-status" class="badge"></span>
            </div>
            <p class="card-soft px-3 py-2.5 text-xs leading-relaxed" data-i18n="email_help"></p>
            <label class="block"><span class="label" data-i18n="api_key"></span><input name="resend_api_key" type="password" class="field" autocomplete="off" dir="ltr" data-i18n-placeholder="api_key_ph"></label>
            <label class="block"><span class="label" data-i18n="mail_from"></span><input name="mail_from" class="field" dir="ltr" data-i18n-placeholder="mail_from_ph"></label>
            <button class="btn btn-primary w-full" data-i18n="save"></button>
            <div class="border-t-2 border-dashed pt-4" style="border-color:var(--line)">
              <span class="label" data-i18n="test_to"></span>
              <div class="flex gap-2">
                <input id="test-email" type="email" class="field" dir="ltr" placeholder="you@email.com">
                <button type="button" id="btn-test-email" class="btn btn-outline shrink-0" data-i18n="send_test"></button>
              </div>
            </div>
          </div>
        </form>
      </section>

      <!-- ===== الإجازات ===== -->
      <section id="tab-holidays" class="tab-panel space-y-4" hidden>
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold" data-i18n="holidays_title"></h2>
            <p class="mt-1 text-sm muted" data-i18n="holidays_hint"></p>
          </div>
          <button id="btn-add-holiday" class="w-only btn btn-primary">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="add_holiday"></span></button>
        </div>
        <div class="grid gap-4 lg:grid-cols-5">
          <div class="card p-4 lg:col-span-3">
            <div class="mb-3 flex items-center justify-between">
              <button id="cal-prev" class="icon-btn" aria-label="previous"><svg viewBox="0 0 24 24" class="h-4 w-4 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
              <h3 id="cal-title" class="font-bold"></h3>
              <button id="cal-next" class="icon-btn" aria-label="next"><svg viewBox="0 0 24 24" class="h-4 w-4 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
            <div id="cal-grid" class="cal-grid"></div>
          </div>
          <div class="card p-4 lg:col-span-2">
            <h3 class="mb-2 font-bold" data-i18n="upcoming"></h3>
            <ul id="holiday-list" class="space-y-2"></ul>
          </div>
        </div>
      </section>

      <!-- ===== الحسابات ===== -->
      <section id="tab-users" class="tab-panel space-y-4" hidden>
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold" data-i18n="users_title"></h2>
            <p class="mt-1 text-sm muted" data-i18n="users_hint"></p>
          </div>
          <button id="btn-add-user" class="btn btn-primary">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="add_user"></span></button>
        </div>
        <ul id="user-list" class="grid gap-3 md:grid-cols-2"></ul>
      </section>

      <!-- ===== سجل التعديلات ===== -->
      <section id="tab-audit" class="tab-panel space-y-4" hidden>
        <div>
          <h2 class="text-xl font-bold" data-i18n="audit_title"></h2>
          <p class="mt-1 text-sm muted" data-i18n="audit_hint"></p>
        </div>
        <form id="audit-form" class="card grid grid-cols-2 gap-3 p-4 md:grid-cols-6">
          <label><span class="label" data-i18n="from"></span><input name="from" type="date" class="field tabular" dir="ltr"></label>
          <label><span class="label" data-i18n="to"></span><input name="to" type="date" class="field tabular" dir="ltr"></label>
          <label class="col-span-2 md:col-span-1"><span class="label" data-i18n="username"></span><select name="user" class="field"></select></label>
          <label class="col-span-2"><span class="label" data-i18n="search"></span><input name="q" class="field" data-i18n-placeholder="search"></label>
          <div class="col-span-2 flex items-end gap-2 md:col-span-1">
            <button class="btn btn-primary flex-1" data-i18n="show"></button>
            <a id="audit-export" class="btn btn-ghost" aria-label="export">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg></a>
          </div>
        </form>
        <ol id="audit-list" class="card divide-y px-4" style="border-color:var(--line)"></ol>
      </section>
    </main>

    <!-- التبويبات أسفل الشاشة (الجوال) -->
    <nav class="fixed inset-x-0 bottom-0 z-20 grid grid-cols-5 border-t-2 bg-white pb-[env(safe-area-inset-bottom)] md:hidden" style="border-color:var(--line)" role="tablist">
      <button class="tab-btn flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold" data-tab="live">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="tab_live"></span></button>
      <button class="tab-btn flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold" data-tab="records">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span data-i18n="tab_records"></span></button>
      <button class="tab-btn relative flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold" data-tab="excuses">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 2h3v16H5V5h3z"/><path d="M12 10v6M9 13h6"/></svg><span data-i18n="tab_excuses"></span>
        <span class="count-pill pending-pill absolute top-1 start-1/2 ms-2" hidden></span></button>
      <button class="tab-btn flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold" data-tab="employees">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.5a3.5 3.5 0 010 7M18 14c2 .7 3.5 2.9 3.5 6"/></svg><span data-i18n="tab_employees"></span></button>
      <button id="btn-more" class="tab-btn flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold" data-more>
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span data-i18n="tab_more"></span></button>
    </nav>
  </div>

  <!-- قائمة المزيد (الجوال) -->
  <dialog id="more-dialog" class="m-0 mt-auto w-full max-w-none rounded-b-none">
    <div class="space-y-1 p-3 pb-[max(1rem,env(safe-area-inset-bottom))]">
      <button class="btn btn-ghost w-full justify-start border-0" data-goto="holidays"><span data-i18n="tab_holidays"></span></button>
      <button class="btn btn-ghost w-full justify-start border-0" data-goto="reminders"><span data-i18n="tab_reminders"></span></button>
      <button class="btn btn-ghost w-full justify-start border-0" data-goto="export"><span data-i18n="tab_export"></span></button>
      <button class="admin-only btn btn-ghost w-full justify-start border-0" data-goto="settings"><span data-i18n="tab_settings"></span></button>
      <button class="admin-only btn btn-ghost w-full justify-start border-0" data-goto="users"><span data-i18n="tab_users"></span></button>
      <button class="admin-only btn btn-ghost w-full justify-start border-0" data-goto="audit"><span data-i18n="tab_audit"></span></button>
      <button class="btn btn-ghost w-full justify-start border-0" id="more-password"><span data-i18n="change_password"></span></button>
      <button class="btn btn-danger w-full justify-start border-0" id="more-logout"><span data-i18n="logout"></span></button>
    </div>
  </dialog>

  <!-- نافذة تعديل موظف -->
  <dialog id="edit-dialog" class="w-[min(92vw,28rem)]">
    <form id="edit-form" method="dialog" class="grid grid-cols-2 gap-3 p-5">
      <h3 class="col-span-2 text-lg font-bold" data-i18n="edit"></h3>
      <input type="hidden" name="id">
      <label><span class="label" data-i18n="emp_no"></span><input name="emp_no" class="field tabular" required dir="ltr"></label>
      <label><span class="label" data-i18n="department"></span><input name="department" class="field"></label>
      <label class="col-span-2"><span class="label" data-i18n="name"></span><input name="name" class="field" required></label>
      <label class="col-span-2"><span class="label" data-i18n="job_title"></span><input name="job_title" class="field"></label>
      <label class="col-span-2"><span class="label" data-i18n="new_pin"></span><input name="pin" class="field tabular" inputmode="numeric" pattern="\d{4,6}" maxlength="6" dir="ltr"></label>
      <label class="col-span-2"><span class="label" data-i18n="geo_mode"></span>
        <select name="geo_mode" class="field geo-mode">
          <option value="any" data-i18n="geo_any"></option><option value="assigned" data-i18n="geo_assigned"></option><option value="exempt" data-i18n="geo_exempt"></option>
        </select></label>
      <div class="site-picker col-span-2 flex flex-wrap gap-2" hidden></div>
      <p id="edit-error" class="col-span-2 text-sm" style="color:var(--red)" hidden></p>
      <button value="cancel" formnovalidate class="btn btn-ghost" data-i18n="cancel"></button>
      <button value="save" class="btn btn-primary" data-i18n="save"></button>
    </form>
  </dialog>

  <!-- نافذة التذكير -->
  <dialog id="reminder-dialog" class="w-[min(94vw,32rem)]">
    <form id="reminder-form" method="dialog" class="grid grid-cols-2 gap-3 p-5">
      <h3 id="reminder-dialog-title" class="col-span-2 text-lg font-bold"></h3>
      <input type="hidden" name="id">
      <label class="col-span-2"><span class="label" data-i18n="r_title"></span><input name="title" class="field" required maxlength="150" data-i18n-placeholder="r_title_ph"></label>
      <label class="col-span-2"><span class="label" data-i18n="r_category"></span>
        <select name="category" class="field">
          <option value="document" data-i18n="cat_document"></option><option value="contract" data-i18n="cat_contract"></option>
          <option value="insurance" data-i18n="cat_insurance"></option><option value="training" data-i18n="cat_training"></option>
          <option value="other" data-i18n="cat_other"></option>
        </select></label>
      <label class="col-span-2"><span class="label" data-i18n="r_recipients"></span><textarea name="recipients" class="field min-h-0" rows="2" required dir="ltr" data-i18n-placeholder="r_recipients_ph"></textarea></label>
      <label><span class="label" data-i18n="r_due"></span><input name="due_date" type="date" class="field tabular" required dir="ltr"></label>
      <label><span class="label" data-i18n="r_repeat"></span>
        <select name="repeat" class="field">
          <option value="once" data-i18n="rep_once"></option><option value="weekly" data-i18n="rep_weekly"></option>
          <option value="monthly" data-i18n="rep_monthly"></option><option value="quarterly" data-i18n="rep_quarterly"></option>
          <option value="semiannual" data-i18n="rep_semiannual"></option><option value="yearly" data-i18n="rep_yearly"></option>
          <option value="biennial" data-i18n="rep_biennial"></option>
        </select></label>
      <label class="col-span-2"><span class="label" data-i18n="r_before"></span>
        <select name="notify_before_days" class="field" id="before-select"></select></label>
      <label class="col-span-2"><span class="label" data-i18n="r_details"></span><textarea name="details" class="field" maxlength="2000"></textarea></label>
      <p id="reminder-error" class="col-span-2 text-sm" style="color:var(--red)" hidden></p>
      <button value="cancel" formnovalidate class="btn btn-ghost" data-i18n="cancel"></button>
      <button value="save" class="btn btn-primary" data-i18n="save"></button>
    </form>
  </dialog>

  <!-- نافذة تغيير كلمة المرور -->
  <dialog id="pw-dialog" class="w-[min(92vw,24rem)]">
    <form id="pw-form" method="dialog" class="space-y-3 p-5">
      <h3 class="text-lg font-bold" data-i18n="change_password"></h3>
      <p id="pw-must" class="card-soft px-3 py-2.5 text-sm" data-i18n="must_change" hidden></p>
      <input name="current" type="password" class="field" data-i18n-placeholder="current_password" autocomplete="current-password" required dir="ltr">
      <input name="next" type="password" class="field" data-i18n-placeholder="new_password" autocomplete="new-password" minlength="8" required dir="ltr">
      <p id="pw-error" class="text-sm" style="color:var(--red)" hidden></p>
      <div class="grid grid-cols-2 gap-3">
        <button value="cancel" formnovalidate class="btn btn-ghost" data-i18n="cancel"></button>
        <button value="save" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- نافذة الموقع -->
  <dialog id="site-dialog" class="w-[min(94vw,30rem)]">
    <form id="site-form" method="dialog" class="space-y-3 p-5">
      <h3 id="site-dialog-title" class="text-lg font-bold"></h3>
      <input type="hidden" name="id">
      <label class="block"><span class="label" data-i18n="site_name"></span><input name="name" class="field" required maxlength="80" data-i18n-placeholder="site_name_ph"></label>
      <div>
        <span class="label" data-i18n="coordinates"></span>
        <input name="coords" class="field tabular" dir="ltr" required data-i18n-placeholder="coordinates_ph">
        <button type="button" id="btn-my-location" class="btn btn-outline btn-sm mt-2 w-full">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
          <span data-i18n="use_my_location"></span></button>
        <p id="coords-msg" class="mt-1.5 text-xs" hidden></p>
      </div>
      <label class="block"><span class="label" data-i18n="radius"></span><input name="radius" type="number" min="20" max="5000" step="10" class="field tabular" dir="ltr" required></label>
      <p id="site-error" class="text-sm" style="color:var(--red)" hidden></p>
      <div class="grid grid-cols-2 gap-3">
        <button value="cancel" formnovalidate class="btn btn-ghost" data-i18n="cancel"></button>
        <button value="save" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- نافذة الإجازة -->
  <dialog id="holiday-dialog" class="w-[min(92vw,26rem)]">
    <form id="holiday-form" method="dialog" class="grid grid-cols-2 gap-3 p-5">
      <h3 id="holiday-dialog-title" class="col-span-2 text-lg font-bold"></h3>
      <input type="hidden" name="id">
      <label class="col-span-2"><span class="label" data-i18n="holiday_name"></span><input name="name" class="field" required maxlength="100" data-i18n-placeholder="holiday_name_ph"></label>
      <label><span class="label" data-i18n="date_from"></span><input name="date_from" type="date" class="field tabular" required dir="ltr"></label>
      <label><span class="label" data-i18n="date_to"></span><input name="date_to" type="date" class="field tabular" dir="ltr"></label>
      <p id="holiday-error" class="col-span-2 text-sm" style="color:var(--red)" hidden></p>
      <button type="button" id="holiday-delete" class="btn btn-danger col-span-2" data-i18n="delete" hidden></button>
      <button value="cancel" formnovalidate class="btn btn-ghost" data-i18n="cancel"></button>
      <button value="save" class="btn btn-primary" data-i18n="save"></button>
    </form>
  </dialog>

  <!-- نافذة الحساب -->
  <dialog id="user-dialog" class="w-[min(92vw,26rem)]">
    <form id="user-form" method="dialog" class="space-y-3 p-5">
      <h3 id="user-dialog-title" class="text-lg font-bold"></h3>
      <input type="hidden" name="id">
      <label class="block"><span class="label" data-i18n="username"></span><input name="username" class="field" dir="ltr" autocomplete="off" required>
        <span class="mt-1 block text-xs muted" data-i18n="username_hint"></span></label>
      <label class="block"><span id="user-pw-label" class="label"></span><input name="password" type="password" class="field" dir="ltr" autocomplete="new-password" minlength="8"></label>
      <fieldset class="space-y-2">
        <legend class="label" data-i18n="role"></legend>
        <label class="card-soft flex cursor-pointer items-start gap-3 px-3 py-2.5"><input type="radio" name="role" value="admin" class="mt-1" style="accent-color:var(--blue)"><span><b data-i18n="role_admin"></b><span class="block text-xs muted" data-i18n="role_admin_desc"></span></span></label>
        <label class="card-soft flex cursor-pointer items-start gap-3 px-3 py-2.5"><input type="radio" name="role" value="hr" class="mt-1" style="accent-color:var(--blue)"><span><b data-i18n="role_hr"></b><span class="block text-xs muted" data-i18n="role_hr_desc"></span></span></label>
        <label class="card-soft flex cursor-pointer items-start gap-3 px-3 py-2.5"><input type="radio" name="role" value="viewer" class="mt-1" style="accent-color:var(--blue)"><span><b data-i18n="role_viewer"></b><span class="block text-xs muted" data-i18n="role_viewer_desc"></span></span></label>
      </fieldset>
      <p id="user-error" class="text-sm" style="color:var(--red)" hidden></p>
      <div class="grid grid-cols-2 gap-3">
        <button value="cancel" formnovalidate class="btn btn-ghost" data-i18n="cancel"></button>
        <button value="save" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 top-20 z-50 flex flex-col items-center gap-2 px-4"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/hr.js"></script>
</body>
</html>
