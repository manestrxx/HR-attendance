<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>نظام الحضور | Attendance</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"IBM Plex Sans Arabic"', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>
    .tabular { font-variant-numeric: tabular-nums; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="min-h-screen bg-stone-100 font-sans text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">
  <div class="mx-auto flex min-h-screen max-w-md flex-col px-4 pb-6 pt-[max(1rem,env(safe-area-inset-top))]">

    <!-- الشريط العلوي -->
    <header class="flex items-center justify-between py-2">
      <div class="flex items-center gap-2">
        <img src="/icon.svg" alt="" class="h-8 w-8">
        <span class="text-lg font-semibold" data-i18n="app_name">نظام الحضور</span>
      </div>
      <button data-lang-toggle class="h-9 min-w-9 rounded-full border border-stone-300 px-3 text-sm font-semibold dark:border-stone-700">EN</button>
    </header>

    <!-- الساعة الحيّة -->
    <section class="mt-4 rounded-3xl bg-teal-700 px-6 py-7 text-center text-white shadow-lg shadow-teal-900/10">
      <div id="clock" class="tabular text-5xl font-bold tracking-tight" dir="ltr">--:--:--</div>
      <div id="date" class="mt-2 text-sm text-teal-100">&nbsp;</div>
    </section>

    <!-- النموذج -->
    <form id="punch-form" class="mt-5 space-y-4 rounded-3xl bg-white p-5 shadow-sm dark:bg-stone-900" autocomplete="off">
      <h1 class="text-base font-semibold" data-i18n="employee_title">تسجيل الحضور والانصراف</h1>

      <label class="block">
        <span class="mb-1.5 block text-sm text-stone-600 dark:text-stone-400" data-i18n="emp_no">الرقم الوظيفي</span>
        <input id="emp_no" name="emp_no" type="text" inputmode="numeric" autocomplete="off" required maxlength="30"
          class="tabular w-full rounded-2xl border border-stone-300 bg-stone-50 px-4 py-3.5 text-lg outline-none transition focus:border-teal-600 focus:bg-white focus:ring-4 focus:ring-teal-600/15 dark:border-stone-700 dark:bg-stone-800" dir="ltr">
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm text-stone-600 dark:text-stone-400" data-i18n="pin">الرمز السري</span>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="\d*" autocomplete="off" required maxlength="6"
          class="tabular w-full rounded-2xl border border-stone-300 bg-stone-50 px-4 py-3.5 text-lg tracking-[0.4em] outline-none transition focus:border-teal-600 focus:bg-white focus:ring-4 focus:ring-teal-600/15 dark:border-stone-700 dark:bg-stone-800" dir="ltr">
      </label>

      <label class="flex items-center gap-2 text-sm text-stone-600 dark:text-stone-400">
        <input id="remember" type="checkbox" class="h-4 w-4 rounded accent-teal-700">
        <span data-i18n="remember">تذكّر رقمي على هذا الجهاز</span>
      </label>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <button type="submit" data-action="in"
          class="rounded-2xl bg-teal-700 py-4 text-base font-semibold text-white shadow-sm transition active:scale-[0.98] disabled:opacity-60 hover:bg-teal-800"
          data-i18n="check_in">تسجيل حضور</button>
        <button type="submit" data-action="out"
          class="rounded-2xl bg-amber-500 py-4 text-base font-semibold text-stone-950 shadow-sm transition active:scale-[0.98] disabled:opacity-60 hover:bg-amber-600"
          data-i18n="check_out">تسجيل انصراف</button>
      </div>
    </form>

    <!-- النتيجة -->
    <div id="result" class="mt-4 hidden" role="status" aria-live="polite"></div>

    <footer class="mt-auto pt-8 text-center">
      <a href="/hr" class="text-sm text-stone-500 underline-offset-4 hover:underline" data-i18n="hr_link">دخول الموارد البشرية</a>
    </footer>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/employee.js"></script>
</body>
</html>
